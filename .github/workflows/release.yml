name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@watchtowerobservability'
      - run: npm ci
      - run: npm test
      - run: npm pack
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: '*.tgz'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.tgz --generate-notes --verify-tag
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
